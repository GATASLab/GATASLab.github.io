<!DOCTYPE html>
<html lang="en">
  <head>
    <!--
      Quarto published the ACT 2025 schedule as its own page at this URL. The
      schedule is now a section of /act2025/, so this redirects to that anchor.

      Hugo's `aliases` front matter cannot target a fragment, which is why this
      is a hand-written file under static/ rather than an alias on the page.
      Hugo does not rewrite static files, so the URLs here are relative: they
      have to resolve both at a domain root and under a GitHub Pages subpath.
      If the schedule heading is renamed, update the anchor below to match.
    -->
    <meta charset="utf-8">
    <meta name="robots" content="noindex">
    <meta http-equiv="refresh" content="0; url=./#schedule">
    <title>ACT 2025 schedule</title>
    <link href="./" rel="canonical">
  </head>
  <body>
    <p>The ACT 2025 schedule has moved to
      <a href="./#schedule">the ACT 2025 page</a>.</p>
  </body>
</html>
