<?xml version="1.0" encoding="UTF-8"?>
<!--
  A structured decomposition of shape K3, redrawn as vector for this site
  from Figure 2 of Bumpus, Kocsis and Master, "Structured Decompositions:
  Structural and Algorithmic Compositionality" (arXiv:2207.06091).

  Three bags, in pink, each holding a graph. Three adhesions, in grey, one
  for each edge of the shape. The dotted red legs are the spans: every
  vertex of an adhesion maps into each of the two bags it sits between, and
  those maps are what glue the pieces into a single object.

  Colours are sampled from the paper: bags #FFB7B7, spans #A7001A. Redrawn
  rather than traced, so the graphs inside the bags are not the paper's.
-->
