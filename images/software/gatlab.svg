<?xml version="1.0" encoding="UTF-8"?>
<!--
  GATlab, drawn for this site: a theory over its terms and its models.

  The shape is the statement. The theory sits at the apex, and both of the
  things GATlab makes from it hang below:

  theory  an inference rule. Hom(a,b) is a type only once a and b have been
          introduced, and that dependency is the whole of what "generalized"
          adds to an algebraic theory.
  terms   the syntax tree of a composite, what the free model hands back, and
          what makes the thing a computer algebra system.
  models  somewhere the symbols land, with composition holding on the nose.

  The base of the triangle is the point of the arrangement: the term model is
  initial among the models of the theory, so there is exactly one map along it,
  which is why it is dashed and carries the unique-existence quantifier. Any
  model you write is reached from the symbols in one way and no other.

  The GATlab paper (arXiv 2404.04837, Lynch, Brown, Fairbanks and Patterson)
  has one figure, the theory of categories written twice, in mathematical and
  in GATlab notation. It is the right idea in the wrong shape for a card: two
  columns of dense listing turn to grey at 300px. This says it in a form that
  survives the size. Colours are Julia's palette, matching the other figures
  drawn for these cards.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 700" width="1160" height="700" role="img" aria-label="A generalized algebraic theory over its term model and its other models, with the unique map out of the terms">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="4.5" markerHeight="4.5" orient="auto-start-reverse">
