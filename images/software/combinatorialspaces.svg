<?xml version="1.0" encoding="UTF-8"?>
<!--
  The discrete de Rham complex, drawn on one triangulated patch: a value on
  every vertex, then on every edge, then on every face, with d carrying each
  to the next. The sizes, widths and opacities encode one fixed arbitrary
  field per dimension, so the picture reads as data on the cells rather than
  as a bare mesh. Drawn for this site; the colours are Julia's palette.
-->
